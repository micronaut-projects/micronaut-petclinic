name: Maven Native Test CI

on:
  push:
    branches:
      - main
      - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
      - main
      - '[1-9]+.[0-9]+.x'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']

    env:
      GRAALVM_QUICK_BUILD: true

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1.6.3
        with:
          distribution: graalvm
          java-version: ${{ matrix.java-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run native tests with Maven
        run: ./mvnw -B -ntp -Pnative -Djdk.version=${{ matrix.java-version }} -Drelease.version=${{ matrix.java-version }} test

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Maven Native Test CI / JDK ${{ matrix.java-version }} / Test Report
          report_paths: '**/target/**/TEST-*.xml'
          check_retries: 'true'
