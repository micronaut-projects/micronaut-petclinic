micronaut:
  http:
    services:
      cat-facts:
        url: ${CAT_FACTS_URL:`https://catfact.ninja`}
        connect-timeout: ${CAT_FACTS_CONNECT_TIMEOUT:1s}
        read-timeout: ${CAT_FACTS_READ_TIMEOUT:2s}
  application:
    name: micronaut-petclinic
  server:
    port: 8080
  router:
    static-resources:
      default:
        enabled: true
        mapping: /resources/**
        paths: classpath:static
  views:
    jte:
      dynamic: false
      binary-static-content: true
  messages:
    basename: i18n/messages

  security:
    intercept-url-map:
      - pattern: /resources/**
        access:
          - isAnonymous()

# Sample data configuration
petclinic:
  cat-facts:
    enabled: ${CAT_FACTS_ENABLED:true}
  sample-data:
    enabled: true

# Logging configuration
logger:
  levels:
    io.micronaut.samples.petclinic: DEBUG
    io.micronaut.data: DEBUG

endpoints:
  info:
    sensitive: false
  health:
    details-visible: authenticated
    jdbc:
      enabled: true

info:
  application:
    name: ${micronaut.application.name}
