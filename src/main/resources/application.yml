micronaut:
  application:
    name: micronaut-petclinic
  server:
    port: 8080
  router:
    static-resources:
      default:
        enabled: true
        mapping: /resources/**
        paths: classpath:static
  views:
    jte:
      dynamic: false
      binary-static-content: true
  messages:
    basename: i18n/messages
  caches:
    owner-details:
      expire-after-write: 60s
      expire-after-access: 30s
      maximum-size: 100
      record-stats: true
      cleanup-interval: 10s
      cleanup-batch-size: 100

  security:
    intercept-url-map:
      - pattern: /resources/**
        access:
          - isAnonymous()

# Sample data configuration
petclinic:
  sample-data:
    enabled: true

# Oracle cache infrastructure is enabled only by application-oracle.yml.
cache:
  enabled: false

# Logging configuration
logger:
  levels:
    io.micronaut.samples.petclinic: DEBUG
    io.micronaut.data: DEBUG

endpoints:
  info:
    sensitive: false
  health:
    details-visible: authenticated
    jdbc:
      enabled: true

info:
  application:
    name: ${micronaut.application.name}
