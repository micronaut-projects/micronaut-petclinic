micronaut:
  application:
    name: micronaut-petclinic
  server:
    port: 8080
  router:
    static-resources:
      default:
        enabled: true
        mapping: /resources/**
        paths: classpath:static
  views:
    jte:
      dynamic: false
      binary-static-content: true
  messages:
    basename: i18n/messages

  security:
    intercept-url-map:
      - pattern: /resources/**
        access:
          - isAnonymous()

# Sample data configuration
petclinic:
  sample-data:
    enabled: true
  visit-reminder:
    enabled: true
    # Daily at 08:00 in the server's local time zone.
    schedule: "0 0 8 * * *"
    lookahead-days: 7

# Logging configuration
logger:
  levels:
    io.micronaut.samples.petclinic: DEBUG
    io.micronaut.data: DEBUG

endpoints:
  info:
    sensitive: false
  health:
    details-visible: authenticated
    jdbc:
      enabled: true

info:
  application:
    name: ${micronaut.application.name}
