micronaut:
  application:
    name: micronaut-petclinic
  server:
    port: 8080
  router:
    static-resources:
      default:
        enabled: true
        mapping: /resources/**
        paths: classpath:static
  caches:
    vets:
      expire-after-write: 60s
      maximum-size: 100
  views:
    jte:
      dynamic: false
      binary-static-content: true
  messages:
    basename: i18n/messages

# Default datasource configuration (H2 in-memory)
datasources:
  default:
    url: jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE ALIAS IF NOT EXISTS H2GIS_SPATIAL FOR 'org.h2gis.functions.factory.H2GISFunctions.load'\;CALL H2GIS_SPATIAL()
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    schema-generate: CREATE_DROP
    dialect: H2
    maximum-pool-size: 2
    minimum-idle: 1


# Sample data configuration
petclinic:
  sample-data:
    enabled: true
  notifications:
    enabled: true
    provider: smtp
    from-address: noreply@petclinic.local
    from-name: Micronaut PetClinic
    recipient: notifications@petclinic.local
    reminders:
      enabled: true
      days-ahead: 1
      fixed-delay: 1h
      initial-delay: 10s

# Logging configuration
logger:
  levels:
    io.micronaut.samples.petclinic: DEBUG
    io.micronaut.data: DEBUG


javamail:
  enabled: true
  properties:
     mail.transport.protocol: smtp
     mail.smtp.host: 'localhost'
     mail.from: noreply@petclinic.local
  authentication:
    enabled: false

endpoints:
  info:
    sensitive: false
  health:
    details-visible: authenticated
    jdbc:
      enabled: true

info:
  application:
    name: ${micronaut.application.name}
