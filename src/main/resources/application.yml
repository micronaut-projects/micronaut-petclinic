micronaut:
  application:
    name: micronaut-petclinic
  server:
    port: 8080
    multipart:
      enabled: true
      max-file-size: ${petclinic.photos.max-size-bytes}
  router:
    static-resources:
      default:
        enabled: true
        mapping: /resources/**
        paths: classpath:static
  views:
    jte:
      dynamic: false
      binary-static-content: true
  messages:
    basename: i18n/messages

  security:
    intercept-url-map:
      - pattern: /resources/**
        access:
          - isAnonymous()

# Sample data configuration
petclinic:
  photos:
    storage-dir: ${PETCLINIC_PHOTO_STORAGE_DIR:./var/pet-photos}
    max-size-bytes: ${PETCLINIC_PHOTO_MAX_SIZE_BYTES:5242880}
  sample-data:
    enabled: true

# Logging configuration
logger:
  levels:
    io.micronaut.samples.petclinic: DEBUG
    io.micronaut.data: DEBUG

endpoints:
  info:
    sensitive: false
  health:
    details-visible: authenticated
    jdbc:
      enabled: true

info:
  application:
    name: ${micronaut.application.name}
