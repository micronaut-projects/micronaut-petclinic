# PostgreSQL Configuration Profile
datasources:
  default:
    db-type: postgres
    schema-generate: CREATE_DROP
    dialect: POSTGRES
    packages:
      # Include shared entities only; exclude Oracle-only JSON duality views.
      - io.micronaut.samples.petclinic.model

# We used this image because the default version that ships with test resources doesn't support geospatial features.
# If you're not using geospatial features the default option should be sufficient & the following section can be removed.
test-resources:
  containers:
    postgres:
      image-name: postgis/postgis:18-3.6-alpine
