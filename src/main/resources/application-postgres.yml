# PostgreSQL Configuration Profile
datasources:
  default:
    db-type: postgres
    schema-generate: CREATE_DROP
    dialect: POSTGRES
    packages:
      # Include shared entities only; exclude Oracle-only JSON duality views.
      - io.micronaut.samples.petclinic.model
    connection-init-sql: >-
      CREATE OR REPLACE FUNCTION SYS_ROW_ETAG(INTEGER, VARCHAR, VARCHAR, VARCHAR)
      RETURNS VARCHAR
      LANGUAGE SQL
      IMMUTABLE
      AS $$
      SELECT upper(md5(
        CASE WHEN $1 IS NULL THEN '-1:' ELSE length($1::text)::text || ':' || $1::text END ||
        CASE WHEN $2 IS NULL THEN '-1:' ELSE length($2)::text || ':' || $2 END ||
        CASE WHEN $3 IS NULL THEN '-1:' ELSE length($3)::text || ':' || $3 END ||
        CASE WHEN $4 IS NULL THEN '-1:' ELSE length($4)::text || ':' || $4 END
      ))::varchar
      $$


# We used this image because the default version that ships with test resources doesn't support geospatial features.
# If you're not using geospatial features the default option should be sufficient & the following section can be removed.
test-resources:
  containers:
    postgres:
      image-name: postgis/postgis:18-3.6-alpine
