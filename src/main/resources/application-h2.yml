# H2 Configuration Profile

# Default datasource configuration (H2 in-memory)
datasources:
  default:
    url: jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE;INIT=CREATE ALIAS IF NOT EXISTS H2GIS_SPATIAL FOR 'org.h2gis.functions.factory.H2GISFunctions.load'\;CALL H2GIS_SPATIAL()
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    schema-generate: CREATE_DROP
    dialect: H2
    maximum-pool-size: 2
    minimum-idle: 1