datasources:
  default:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: petclinic
    password: petclinic
    driver-class-name: oracle.jdbc.OracleDriver
    dialect: ORACLE
    # Scan shared entities and Oracle-specific JSON duality view mappings.
    packages:
      - io.micronaut.samples.petclinic.model
      - io.micronaut.samples.petclinic.oracle.model
    initialization-fail-timeout: 60000
    connection-timeout: 30000
    maximum-pool-size: 10
    minimum-idle: 2
    dialect-options:
      version: 23.1

logger:
  levels:
    io.micronaut.samples.petclinic: INFO
    io.micronaut.data: INFO
