# Oracle Configuration Profile
datasources:
  default:
    db-type: oracle
    schema-generate: CREATE_DROP
    dialect: ORACLE
    initialization-fail-timeout: 60000
    connection-timeout: 30000
    maximum-pool-size: 10
    minimum-idle: 2
    dialect-options:
      version: 23.1

# We used this image because the default version that ships with test resources doesn't support geospatial features.
# If you're not using geospatial features the default option should be sufficient & the following section can be removed.
test-resources:
  containers:
    oracle:
      image-name: gvenzl/oracle-free:23.26.2-faststart
      copy-to-container:
        - "docker/oracle/01-init-user.sql": /container-entrypoint-initdb.d/01-init-user.sql

logger:
  levels:
    io.micronaut.samples.petclinic: INFO
    io.micronaut.data: INFO
