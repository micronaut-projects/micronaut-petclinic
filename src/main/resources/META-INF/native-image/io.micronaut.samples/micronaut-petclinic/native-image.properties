## workaround https://github.com/Azure/azure-sdk-for-java/issues/50587
## Azure Core 1.59.1 initializes Base64Variants at build time. Its immutable
## Base64Variant constants and padding enum must use the same initialization phase.
Args=--initialize-at-build-time=com.fasterxml.jackson.core.Base64Variant,com.fasterxml.jackson.core.Base64Variant$PaddingReadBehaviour
