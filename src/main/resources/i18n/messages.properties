transactionPriority.title=Oracle Booking Transactions
transactionPriority.intro=Explore booking priority and appointment holds completed across separate requests.
transactionPriority.controls=Try the booking race
transactionPriority.instructions=Choose an available appointment. Start a regular booking to hold it for {0} seconds, or start an emergency booking directly. During a regular booking, you can send an emergency request for the same appointment to demonstrate priority. Wait for the result, then retry with an available appointment.
transactionPriority.availableAppointments=Available appointments, in order
transactionPriority.startLow=Start regular booking
transactionPriority.startHigh=Start emergency booking
transactionPriority.reset=Reset appointments
transactionPriority.regular=Regular booking
transactionPriority.emergency=Emergency booking
transactionPriority.result=What happened
transactionPriority.appointment=Requested appointment
transactionPriority.databaseStatus=Committed database status
transactionPriority.suggestion=Next available appointment
transactionPriority.how=How this demonstrates Micronaut and Oracle
transactionPriority.explanation=Each button sends a separate request to the /book endpoint with type=regular or type=emergency. The server dispatches it to the corresponding @OracleTransactional method. LOW locks the appointment and pauses for {0} seconds. HIGH requests the same row. Oracle can roll LOW back after HIGH waits about 3 seconds. LOW discovers that rollback when it tries its final update.
transactionPriority.limitations=The countdown is approximate; each request reports its result only after commit or rollback. The {0}-second pause is for this showcase only. Both transactions have a 30-second transaction timeout. Reset is available after the requests finish.
transactionPriority.noAvailable=No appointments available. Reset to try again.

sessionless.title=Hold an appointment, then confirm
sessionless.instructions=Choose an appointment and hold it for up to {0} seconds. Confirm to finish the booking, or cancel to release it. This example has its own appointments and reset.
sessionless.hold=Hold appointment
sessionless.confirm=Confirm booking
sessionless.cancel=Cancel hold
sessionless.refresh=Refresh committed state
sessionless.reset=Reset confirmed bookings
sessionless.ready=Choose an appointment to begin.
sessionless.held=The appointment is held. Confirm or cancel before the confirmation window ends.
sessionless.confirmed=Booking confirmed. The appointment is now committed.
sessionless.cancelled=Hold cancelled. The original transaction was rolled back.
sessionless.elapsed=Confirmation window elapsed. Confirm or cancel to check whether the hold is still available.
sessionless.working=Working…
sessionless.error=The result could not be confirmed. Refresh committed state before trying again.
sessionless.noAvailable=No appointments available. Reset confirmed bookings to try again.
sessionless.storageError=Browser storage is unavailable. Keep this page open to confirm or cancel the hold.
sessionless.pending=Pending appointment:
sessionless.countdown=Approximate time remaining:
sessionless.committed=Committed database state. An uncommitted hold can still appear as AVAILABLE.
sessionless.explanation=Hold calls @OracleTransactional(sessionless = SUSPEND, timeout = {0}). Oracle keeps the uncommitted change and row lock while the JDBC connection returns to the pool. Confirm and Cancel send the encoded transaction ID in a JSON body; an explicit propagation scope resumes the transaction with REQUIRES_SUSPENDED. Confirm commits; Cancel marks the original transaction rollback-only. Other sessions cannot see the held status until commit, and competing holds wait for the row lock. Oracle rolls back abandoned holds after the suspension timeout. Refresh does not resume or extend a hold.
sessionless.error.NOT_FOUND=Appointment not found in this example.
sessionless.error.INVALID_REQUEST=Provide a valid appointment and transaction ID.
sessionless.error.INVALID_TRANSACTION_ID=The transaction ID is malformed.
sessionless.error.UNAVAILABLE=The appointment or hold is unavailable. It may have expired or already completed. Refresh committed state and choose another appointment.
sessionless.error.BUSY=The appointment or transaction is busy. Wait for the other request to finish and try again.
sessionless.error.FAILED=The result could not be confirmed. Refresh committed state before trying again.
