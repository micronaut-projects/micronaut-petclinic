micronaut:
  server:
    port: -1
  application:
    name: micronaut-petclinic-test
  views:
    jte:
      dynamic: false

# MySQL Test Resources runs the MySQL server with binary logging enabled.
# Allow the application test user to create the deterministic SYS_ROW_ETAG function.
test-resources:
  containers:
    mysql:
      command:
        - --log-bin-trust-function-creators=ON

# Enable sample data for tests
petclinic:
  sample-data:
    enabled: true

endpoints:
  info:
    sensitive: false
  health:
    details-visible: authenticated
    jdbc:
      enabled: true

info:
  application:
    name: ${micronaut.application.name}
